name: Restore approved Romanija images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-approved-site.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify exact image transfer segments
        run: |
          cat > /tmp/chunks.sha256 <<'EOF'
          20786ba8c0468ee11546b3dd78f755667caec72fa4cbf85a6fe5392b7be0372a  restore-parts/part01.txt
          de7314570c3b01c3e99973e62c245ee377aac17323a08d274aa5c11743191974  restore-parts/part02.txt
          e93fc4a21a03f34557678f56f5a618019c70ed9d4eee7aea931ad8531e7514f1  restore-parts/part03.txt
          961f74400b4bc427832fc215ea673a9cc9700253cd40c7e661c235adaae044b2  fixparts/04a.txt
          727e5c745fc8b08a2d4bb753ca8a95308f8b15e9fdf063e4aef383be2a9e08a9  fixparts/04b.txt
          c4e8b4f9320b9f4f307aaa36b7aa85f17ad68cfa61b2b4b873a28d4b15a5dbdd  fixparts/04c.txt
          84ceedc6d90961c62a0c4d93ad74b3ab6d36917168cfcac2ce41fd0fbf435380  fixparts/05a.txt
          820ccbe533805127b6d9b777132dc864756479fdfb959ab1c1b02f3812ffaf87  fixparts/05rest.txt
          5fe0985fe07e5f55335b70db9683c60d68a5de31a300b7bff605e81e477986a1  goodparts/part06.txt
          a9087f2ea5bb1d8a443b34949e4b1be923d08f0f4469b2e813aab1592947d123  goodparts/part07.txt
          bd7020a47166e8abaebb9a30be6a513222833c0902f8bf7d1fccf8cd751e8df4  fix2v2/08a.txt
          9893d9d53a2ffc9ee2652fb838777e25b30936ef3b4b00e1a0a8dc77774bf195  fix2v2/08b.txt
          6184b21f1bdb5201cbaa2f383d1967922f707acfc98746c2df225b4bf5f31914  fix2v2/08c.txt
          9c2262140a30db8820ced8ac3c952563a0b4f0d7830ab90406c95e8df324c48d  goodparts/part09.txt
          2291272b57874ce50a889a025597a6fe74d61a1bab72ed9a79901717fabbd057  goodparts/part10.txt
          EOF
          sha256sum -c /tmp/chunks.sha256

      - name: Rebuild and validate approved image archive
        run: |
          cat \
            restore-parts/part01.txt \
            restore-parts/part02.txt \
            restore-parts/part03.txt \
            fixparts/04a.txt fixparts/04b.txt fixparts/04c.txt \
            fixparts/05a.txt fixparts/05rest.txt \
            goodparts/part06.txt \
            goodparts/part07.txt \
            fix2v2/08a.txt fix2v2/08b.txt fix2v2/08c.txt \
            goodparts/part09.txt \
            goodparts/part10.txt > /tmp/images.b64
          base64 --decode /tmp/images.b64 > /tmp/romanija-approved-images.zip
          echo "db0e3143406badd48236744355db3a3f0980ed2dd425b28d257171d35716da69  /tmp/romanija-approved-images.zip" | sha256sum -c -
          unzip -t /tmp/romanija-approved-images.zip
          rm -rf assets
          mkdir -p assets
          unzip -o /tmp/romanija-approved-images.zip -d assets
          test "$(find assets -maxdepth 1 -name 'image-*.jpg' | wc -l)" -eq 10

      - name: Point both language pages to restored local images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          romanija = "https://nacelnik.net/wp-content/uploads/2023/02/romanija24042019_3.jpg"
          replacements = {
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/Plum_orchard_-_geograph.org.uk_-_259674.jpg": "assets/image-03.jpg",
              "https://a0.muscache.com/im/pictures/hosting/Hosting-U3RheVN1cHBseUxpc3Rpbmc6NDI2OTgyNDQ%3D/original/7422a100-4acf-4ef4-9cce-4df41ab45757.jpeg?im_w=720": "assets/image-04.jpg",
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/Via_Ferrata.jpg": "assets/image-05.jpg",
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/Field_of_Prunus_domestica_L._2022-08-16.jpg": "assets/image-06.jpg",
              "https://q-xx.bstatic.com/xdata/images/hotel/max1280x900/573506117.jpg?k=d2c2150beee510f6b92adb05e6af74b673d2ab6cd5b242e095083e991a2c79c4&o=": "assets/image-07.jpg",
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mountain_Biking_in_the_Forest_of_Bowland.jpg": "assets/image-08.jpg",
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/Sarajevo_-_Sebilj_(49132568612).jpg": "assets/image-09.jpg",
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mountain_Stream_Sun_Valley.jpg": "assets/image-10.jpg",
          }

          for filename in ("index.html", "sr.html"):
              p = Path(filename)
              s = p.read_text(encoding="utf-8")
              # Romanija image appears in three CSS rules; the approved version uses
              # image-01 for hero/story and image-02 for the landscape section.
              s = re.sub(r"(\.hero\{[^}]*?)url\(['\"]?" + re.escape(romanija) + r"['\"]?\)", r"\1url('assets/image-01.jpg')", s, flags=re.S)
              s = re.sub(r"(\.story-photo\{[^}]*?)url\(['\"]?" + re.escape(romanija) + r"['\"]?\)", r"\1url('assets/image-01.jpg')", s, flags=re.S)
              s = re.sub(r"(\.land-image\{[^}]*?)url\(['\"]?" + re.escape(romanija) + r"['\"]?\)", r"\1url('assets/image-02.jpg')", s, flags=re.S)
              for old, new in replacements.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Commit restored site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html sr.html
          git commit -m "Restore approved Romanija visuals" || exit 0
          git push
