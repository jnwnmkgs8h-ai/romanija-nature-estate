name: Refresh selected Romanija image URLs
on:
  push:
    paths:
      - '.github/workflows/cache-bust-selected-images.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add cache-busting URLs only to requested images
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','sr.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              # Hero only: replace the first image-01 occurrence, leaving the later story image untouched.
              s = s.replace("url('assets/image-01.jpg')", "url('assets/image-01.jpg?v=hq2')", 1)
              # Landscape section.
              s = s.replace("url('assets/image-02.jpg')", "url('assets/image-02.jpg?v=hq2')", 1)
              # Find your rhythm cards only.
              s = s.replace("url('assets/image-04.jpg')", "url('assets/image-04.jpg?v=hq2')")
              s = s.replace("url('assets/image-05.jpg')", "url('assets/image-05.jpg?v=hq2')")
              s = s.replace("url('assets/image-06.jpg')", "url('assets/image-06.jpg?v=hq2')")
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only URL refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sr.html
          git diff --cached --quiet || git commit -m 'Refresh selected high-quality image URLs'
          git push
